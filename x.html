<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A premium digital experience.">
  <title>VÉRA — Premium Digital Experience</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');

    :root {
      --bg: #080808;
      --surface: #101010;
      --surface-2: #151515;
      --text: #f5f3ef;
      --muted: #85817b;
      --line: rgba(255,255,255,.1);
      --gold: #c8a96b;
      --gold-light: #e6cf9d;
      --max: 1240px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* ---------- GLOBAL ---------- */

    .container {
      width: min(var(--max), calc(100% - 48px));
      margin: auto;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--gold-light);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--gold);
    }

    .gold {
      color: var(--gold-light);
    }

    .serif {
      font-family: "Playfair Display", serif;
    }

    /* ---------- HEADER ---------- */

    header {
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      transition: .35s ease;
    }

    header.scrolled {
      background: rgba(8,8,8,.82);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 25px;
      letter-spacing: 5px;
    }

    .logo span {
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      gap: 38px;
      list-style: none;
    }

    .nav-links a {
      color: #aaa69f;
      font-size: 12px;
      transition: .25s;
    }

    .nav-links a:hover {
      color: white;
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 100px;
      font-size: 11px;
      transition: .3s;
    }

    .nav-cta:hover {
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .menu {
      display: none;
      border: 0;
      background: transparent;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    /* ---------- HERO ---------- */

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 72% 45%, rgba(200,169,107,.13), transparent 27%),
        radial-gradient(circle at 15% 80%, rgba(255,255,255,.04), transparent 30%);
    }

    .hero-grid {
      position: absolute;
      inset: 0;
      opacity: .25;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      padding-top: 80px;
    }

    .hero-copy {
      max-width: 850px;
    }

    .hero h1 {
      margin-top: 25px;
      font-size: clamp(60px, 9vw, 130px);
      line-height: .88;
      letter-spacing: -6px;
      font-weight: 500;
    }

    .hero h1 em {
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-weight: 500;
      color: var(--gold-light);
    }

    .hero-description {
      max-width: 510px;
      margin-top: 32px;
      color: #92908b;
      font-size: 15px;
      line-height: 1.8;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 38px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-width: 160px;
      padding: 15px 22px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .5px;
      transition: .35s;
    }

    .btn-primary {
      color: #0a0908;
      background: linear-gradient(135deg, #e7d19f, #b99454);
      box-shadow: 0 15px 45px rgba(200,169,107,.15);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 55px rgba(200,169,107,.25);
    }

    .btn-secondary {
      border: 1px solid var(--line);
      color: #c5c1bb;
    }

    .btn-secondary:hover {
      border-color: rgba(255,255,255,.3);
      color: white;
    }

    .hero-number {
      position: absolute;
      right: 0;
      bottom: 60px;
      font-size: 10px;
      color: #55514b;
      letter-spacing: 2px;
    }

    /* ---------- ORB ---------- */

    .orb-wrap {
      position: absolute;
      right: 4%;
      top: 50%;
      transform: translateY(-50%);
      width: min(42vw, 620px);
      aspect-ratio: 1;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      inset: 15%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 25%, #fff4d0 0, #d4b575 8%, #846d45 27%, #28231b 58%, #090909 76%);
      box-shadow:
        inset -45px -35px 80px #000,
        0 0 100px rgba(200,169,107,.12);
      animation: float 8s ease-in-out infinite;
    }

    .orb::before {
      content: "";
      position: absolute;
      inset: -13%;
      border: 1px solid rgba(200,169,107,.2);
      border-radius: 50%;
      transform: rotate(25deg) scaleY(.3);
    }

    .orb::after {
      content: "";
      position: absolute;
      inset: -4%;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 50%;
    }

    .orb-ring {
      position: absolute;
      inset: 3%;
      border: 1px solid rgba(200,169,107,.12);
      border-radius: 50%;
      animation: spin 25s linear infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-16px) rotate(3deg); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---------- MARQUEE ---------- */

    .marquee {
      overflow: hidden;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 18px 0;
      background: #0b0b0b;
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee 24s linear infinite;
    }

    .marquee-item {
      display: flex;
      align-items: center;
      gap: 30px;
      padding-right: 30px;
      color: #65615c;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .marquee-item b {
      color: var(--gold);
      font-size: 14px;
    }

    @keyframes marquee {
      to { transform: translateX(-50%); }
    }

    /* ---------- INTRO ---------- */

    .intro {
      padding: 170px 0;
    }

    .intro-layout {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 100px;
      align-items: start;
    }

    .intro-label {
      position: sticky;
      top: 130px;
    }

    .intro h2 {
      max-width: 850px;
      font-size: clamp(40px, 5vw, 70px);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -3px;
    }

    .intro h2 span {
      color: #595650;
    }

    .intro p {
      max-width: 620px;
      margin-top: 35px;
      color: #7e7b75;
      font-size: 15px;
      line-height: 1.9;
    }

    /* ---------- CARDS ---------- */

    .experience {
      padding: 50px 0 170px;
    }

    .section-top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 55px;
    }

    .section-top h2 {
      margin-top: 15px;
      font-size: clamp(42px, 5vw, 68px);
      font-weight: 400;
      letter-spacing: -3px;
    }

    .section-top p {
      max-width: 300px;
      color: #68655f;
      font-size: 12px;
      line-height: 1.7;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .card {
      min-height: 480px;
      padding: 30px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--surface);
      transition: .45s;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(200,169,107,.3);
    }

    .card-visual {
      position: absolute;
      inset: 0;
      opacity: .9;
    }

    .visual-one {
      background:
        radial-gradient(circle at 65% 35%, rgba(214,181,113,.4), transparent 15%),
        linear-gradient(145deg, #17130d, #080808 65%);
    }

    .visual-two {
      background:
        radial-gradient(circle at 35% 40%, rgba(255,255,255,.14), transparent 15%),
        linear-gradient(145deg, #171717, #080808);
    }

    .visual-three {
      background:
        radial-gradient(circle at 70% 60%, rgba(100,86,60,.5), transparent 17%),
        linear-gradient(145deg, #171512, #080808);
    }

    .card-content {
      position: absolute;
      z-index: 2;
      left: 30px;
      right: 30px;
      bottom: 30px;
    }

    .card-number {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 2px;
    }

    .card h3 {
      margin-top: 10px;
      font-family: "Playfair Display", serif;
      font-size: 32px;
      font-weight: 500;
    }

    .card p {
      margin-top: 12px;
      color: #817d76;
      font-size: 12px;
      line-height: 1.7;
    }

    .card-link {
      display: inline-flex;
      margin-top: 20px;
      color: var(--gold-light);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ---------- STATEMENT ---------- */

    .statement {
      padding: 160px 0;
      text-align: center;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(circle at 50% 50%, rgba(200,169,107,.08), transparent 35%);
    }

    .statement h2 {
      max-width: 1050px;
      margin: 25px auto 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(44px, 7vw, 92px);
      font-weight: 500;
      line-height: 1.03;
      letter-spacing: -4px;
    }

    .statement h2 em {
      color: var(--gold-light);
    }

    /* ---------- PROCESS ---------- */

    .process {
      padding: 170px 0;
    }

    .process-list {
      margin-top: 65px;
      border-top: 1px solid var(--line);
    }

    .process-item {
      display: grid;
      grid-template-columns: 100px 1fr 1fr;
      gap: 40px;
      padding: 32px 0;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }

    .process-item > span {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 2px;
    }

    .process-item h3 {
      font-family: "Playfair Display", serif;
      font-size: 30px;
      font-weight: 500;
    }

    .process-item p {
      color: #74716b;
      font-size: 12px;
      line-height: 1.8;
      max-width: 380px;
    }

    /* ---------- CTA ---------- */

    .final-cta {
      position: relative;
      padding: 180px 0;
      text-align: center;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(200,169,107,.14), transparent 35%),
        #0b0b0b;
    }

    .final-cta h2 {
      max-width: 850px;
      margin: 25px auto 35px;
      font-size: clamp(50px, 7vw, 95px);
      line-height: .95;
      font-weight: 400;
      letter-spacing: -5px;
    }

    .final-cta p {
      max-width: 480px;
      margin: auto;
      color: #77736d;
      font-size: 14px;
      line-height: 1.8;
    }

    /* ---------- FOOTER ---------- */

    footer {
      padding: 55px 0 30px;
      border-top: 1px solid var(--line);
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
    }

    .footer-brand p {
      max-width: 280px;
      margin-top: 15px;
      color: #64615c;
      font-size: 11px;
      line-height: 1.8;
    }

    .footer-links {
      display: flex;
      gap: 70px;
    }

    .footer-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .footer-column span {
      margin-bottom: 5px;
      color: #55514b;
      font-size: 9px;
      letter-spacing: 2px;
    }

    .footer-column a {
      color: #96928a;
      font-size: 11px;
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      margin-top: 90px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: #4f4c47;
      font-size: 9px;
      letter-spacing: 1px;
    }

    /* ---------- REVEAL ---------- */

    .reveal {
      opacity: 0;
      transform: translateY(35px);
      transition: opacity .9s ease, transform .9s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ---------- MOBILE ---------- */

    @media (max-width: 900px) {
      .nav-links,
      .nav-cta {
        display: none;
      }

      .menu {
        display: block;
      }

      .hero {
        min-height: 900px;
      }

      .orb-wrap {
        width: 500px;
        right: 50%;
        top: 65%;
        transform: translate(50%, -50%);
        opacity: .5;
      }

      .hero-copy {
        position: relative;
        z-index: 5;
      }

      .hero
